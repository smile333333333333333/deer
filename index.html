<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pinewood - The Woods</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #090b0d;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

canvas {
    display: block;
    margin: auto;
    background: #182018;
    image-rendering: pixelated;
}

#ui {
    position: fixed;
    top: 12px;
    left: 12px;
    width: 220px;
    pointer-events: none;
}

.bar {
    height: 18px;
    background: #222;
    border: 2px solid #111;
    margin-bottom: 8px;
}

.fill {
    height: 100%;
}

#health {
    background: #c93434;
    width: 100%;
}

#stamina {
    background: #d5a82e;
    width: 100%;
}

#message {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.8);
    padding: 12px 20px;
    border: 2px solid #555;
    display: none;
    max-width: 600px;
    text-align: center;
}

#cutscene {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 40px;
}

#cutsceneText {
    max-width: 700px;
    font-size: 25px;
    line-height: 1.5;
}

#continue {
    margin-top: 25px;
    color: #aaa;
}

#title {
    position: fixed;
    top: 12px;
    right: 15px;
    font-size: 18px;
    color: #aaa;
}

</style>
</head>

<body>

<canvas id="game" width="960" height="540"></canvas>

<div id="ui">
    <div>HEALTH</div>
    <div class="bar">
        <div id="health" class="fill"></div>
    </div>

    <div>STAMINA</div>
    <div class="bar">
        <div id="stamina" class="fill"></div>
    </div>

    <div>WASD = Move | E = Talk | SPACE = Attack</div>
</div>

<div id="title">PINEWOOD — 1997</div>

<div id="message"></div>

<div id="cutscene">
    <div id="cutsceneText"></div>
    <div id="continue">Press ENTER</div>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const healthBar = document.getElementById("health");
const staminaBar = document.getElementById("stamina");

const message = document.getElementById("message");

const cutscene = document.getElementById("cutscene");
const cutsceneText = document.getElementById("cutsceneText");

let keys = {};

document.addEventListener("keydown", e => {

    keys[e.key.toLowerCase()] = true;

    if (e.key === "Enter") {
        nextCutscene();
    }

    if (e.key === " ") {
        attack();
    }

});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});


// --------------------------------------------------
// PLAYER
// --------------------------------------------------

let player = {
    x: 300,
    y: 280,
    size: 18,
    speed: 2.5,
    health: 100,
    stamina: 100,
    facing: "down"
};


// --------------------------------------------------
// WORLD
// --------------------------------------------------

const world = {
    width: 2200,
    height: 1600
};


// --------------------------------------------------
// CAMERA
// --------------------------------------------------

let camera = {
    x: 0,
    y: 0
};


// --------------------------------------------------
// NPCs
// --------------------------------------------------

let npcs = [

    {
        x: 430,
        y: 220,
        name: "Marty",
        color: "#4d82b8",
        dialogue: [
            "You hear about what happened by the creek?",
            "Something tore up a deer last night.",
            "My dad says it's just a wolf.",
            "...I don't think it's a wolf."
        ]
    },

    {
        x: 700,
        y: 330,
        name: "Mrs. Miller",
        color: "#c77c48",
        dialogue: [
            "You shouldn't go into those woods.",
            "People have been disappearing around there for years.",
            "There used to be a laboratory out there.",
            "Nobody talks about it anymore."
        ]
    },

    {
        x: 980,
        y: 480,
        name: "Sheriff",
        color: "#777777",
        dialogue: [
            "Stay out of the woods after dark.",
            "That's all I'm going to say.",
            "And don't go near the old cabin."
        ]
    }

];


// --------------------------------------------------
// ANIMALS
// --------------------------------------------------

let animals = [

    {
        x: 520,
        y: 650,
        type: "deer",
        health: 30,
        friendly: true,
        color: "#996633"
    },

    {
        x: 820,
        y: 700,
        type: "wolf",
        health: 40,
        friendly: false,
        color: "#777"
    },

    {
        x: 1100,
        y: 850,
        type: "deer",
        health: 30,
        friendly: true,
        color: "#996633"
    }

];


// --------------------------------------------------
// TREES
// --------------------------------------------------

let trees = [];

for (let i = 0; i < 180; i++) {

    trees.push({
        x: Math.random() * world.width,
        y: 500 + Math.random() * 1000
    });

}


// --------------------------------------------------
// CUTSCENES
// --------------------------------------------------

let currentCutscene = null;
let cutsceneIndex = 0;

const openingCutscene = [

    "PINEWOOD, 1997.",

    "For the last two weeks, everyone in town has been talking about something in the woods.",

    "Some say it's a giant animal.",

    "Some say it's a man.",

    "Your friend says he saw antlers between the trees.",

    "You don't believe him.",

    "So tonight, you're going to find out for yourself.",

    "OBJECTIVE: Find out what is living in the woods."

];

function startCutscene(scene) {

    currentCutscene = scene;
    cutsceneIndex = 0;

    cutscene.style.display = "flex";

    showCutsceneText();

}

function showCutsceneText() {

    if (!currentCutscene) return;

    cutsceneText.innerText =
        currentCutscene[cutsceneIndex];

}

function nextCutscene() {

    if (!currentCutscene) return;

    cutsceneIndex++;

    if (cutsceneIndex >= currentCutscene.length) {

        currentCutscene = null;
        cutscene.style.display = "none";

        return;
    }

    showCutsceneText();

}


// --------------------------------------------------
// MESSAGE
// --------------------------------------------------

let messageTimer = 0;

function showMessage(text) {

    message.innerText = text;
    message.style.display = "block";

    messageTimer = 180;

}


// --------------------------------------------------
// COLLISION
// --------------------------------------------------

function distance(a,b) {

    return Math.sqrt(
        (a.x-b.x)**2 +
        (a.y-b.y)**2
    );

}


// --------------------------------------------------
// PLAYER MOVEMENT
// --------------------------------------------------

function updatePlayer() {

    let dx = 0;
    let dy = 0;

    if (keys["w"]) {
        dy--;
        player.facing = "up";
    }

    if (keys["s"]) {
        dy++;
        player.facing = "down";
    }

    if (keys["a"]) {
        dx--;
        player.facing = "left";
    }

    if (keys["d"]) {
        dx++;
        player.facing = "right";
    }

    if (dx !== 0 || dy !== 0) {

        let speed = player.speed;

        if (keys["shift"] && player.stamina > 0) {

            speed = 4.5;
            player.stamina -= .7;

        } else {

            player.stamina += .35;

        }

        player.stamina =
            Math.max(0, Math.min(100, player.stamina));

        player.x += dx * speed;
        player.y += dy * speed;

    } else {

        player.stamina += .5;

        player.stamina =
            Math.min(100, player.stamina);

    }

    player.x =
        Math.max(20, Math.min(world.width-20, player.x));

    player.y =
        Math.max(20, Math.min(world.height-20, player.y));

}


// --------------------------------------------------
// TALKING
// --------------------------------------------------

function talk() {

    for (let npc of npcs) {

        if (distance(player,npc) < 55) {

            let line =
                npc.dialogue[
                    Math.floor(Math.random() * npc.dialogue.length)
                ];

            showMessage(npc.name + ": " + line);

            return;
        }

    }

    for (let animal of animals) {

        if (distance(player,animal) < 55) {

            if (animal.type === "deer") {

                showMessage("The deer stares at you.");

            }

            if (animal.type === "wolf") {

                showMessage("The wolf growls.");

            }

            return;
        }

    }

}


// E key
let previousE = false;

function checkTalk() {

    if (keys["e"] && !previousE) {
        talk();
    }

    previousE = keys["e"];

}


// --------------------------------------------------
// COMBAT
// --------------------------------------------------

function attack() {

    if (player.stamina < 15) return;

    player.stamina -= 15;

    for (let animal of animals) {

        if (
            distance(player, animal) < 65 &&
            !animal.friendly
        ) {

            animal.health -= 15;

            showMessage("You fought off the animal.");

            if (animal.health <= 0) {

                animal.health = 0;
                animal.dead = true;

            }

        }

    }

}


// --------------------------------------------------
// ANIMAL AI
// --------------------------------------------------

function updateAnimals() {

    for (let animal of animals) {

        if (animal.dead) continue;

        let dx = Math.random() - .5;
        let dy = Math.random() - .5;

        animal.x += dx * .5;
        animal.y += dy * .5;

        // Hostile animals occasionally approach player

        if (!animal.friendly &&
            distance(player,animal) < 220) {

            let angle =
                Math.atan2(
                    player.y-animal.y,
                    player.x-animal.x
                );

            animal.x += Math.cos(angle) * .7;
            animal.y += Math.sin(angle) * .7;

            if (distance(player,animal) < 30) {

                player.health -= .15;

            }

        }

    }

}


// --------------------------------------------------
// DRAW WORLD
// --------------------------------------------------

function drawWorld() {

    ctx.fillStyle = "#273827";

    ctx.fillRect(
        -camera.x,
        -camera.y,
        world.width,
        world.height
    );


    // Town

    ctx.fillStyle = "#6b6255";

    ctx.fillRect(
        0-camera.x,
        0-camera.y,
        1200,
        500
    );


    // Roads

    ctx.fillStyle = "#343434";

    ctx.fillRect(
        0-camera.x,
        300-camera.y,
        1200,
        100
    );

    ctx.fillRect(
        250-camera.x,
        0-camera.y,
        100,
        500
    );


    // Woods

    ctx.fillStyle = "#182718";

    ctx.fillRect(
        0-camera.x,
        500-camera.y,
        world.width,
        1100
    );


    // Buildings

    drawBuilding(80,80,130,100,"HOME");

    drawBuilding(500,80,180,120,"DINER");

    drawBuilding(780,80,150,120,"STORE");

    drawBuilding(1000,80,140,150,"SHERIFF");


    // Old cabin

    drawBuilding(
        1450,
        850,
        180,
        130,
        "OLD CABIN"
    );


    // Trees

    for (let tree of trees) {

        ctx.fillStyle = "#513a28";

        ctx.fillRect(
            tree.x-camera.x-5,
            tree.y-camera.y,
            10,
            25
        );

        ctx.fillStyle = "#244c29";

        ctx.beginPath();

        ctx.arc(
            tree.x-camera.x,
            tree.y-camera.y-5,
            20,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}


function drawBuilding(x,y,w,h,name) {

    ctx.fillStyle = "#9b7255";

    ctx.fillRect(
        x-camera.x,
        y-camera.y,
        w,
        h
    );

    ctx.fillStyle = "#222";

    ctx.fillRect(
        x-camera.x+w/2-15,
        y-camera.y+h-40,
        30,
        40
    );

    ctx.fillStyle = "white";

    ctx.font = "12px Arial";

    ctx.fillText(
        name,
        x-camera.x+10,
        y-camera.y+20
    );

}


// --------------------------------------------------
// DRAW NPCS
// --------------------------------------------------

function drawNPCs() {

    for (let npc of npcs) {

        ctx.fillStyle = npc.color;

        ctx.fillRect(
            npc.x-camera.x-10,
            npc.y-camera.y-10,
            20,
            20
        );

        ctx.fillStyle = "white";

        ctx.font = "11px Arial";

        ctx.fillText(
            npc.name,
            npc.x-camera.x-20,
            npc.y-camera.y-18
        );

    }

}


// --------------------------------------------------
// DRAW ANIMALS
// --------------------------------------------------

function drawAnimals() {

    for (let animal of animals) {

        if (animal.dead) continue;

        ctx.fillStyle = animal.color;

        ctx.beginPath();

        ctx.arc(
            animal.x-camera.x,
            animal.y-camera.y,
            13,
            0,
            Math.PI*2
        );

        ctx.fill();

        // deer antlers

        if (animal.type === "deer") {

            ctx.strokeStyle = "#ddd";
            ctx.lineWidth = 2;

            ctx.beginPath();

            ctx.moveTo(
                animal.x-camera.x-8,
                animal.y-camera.y-8
            );

            ctx.lineTo(
                animal.x-camera.x-12,
                animal.y-camera.y-18
            );

            ctx.moveTo(
                animal.x-camera.x+8,
                animal.y-camera.y-8
            );

            ctx.lineTo(
                animal.x-camera.x+12,
                animal.y-camera.y-18
            );

            ctx.stroke();

        }

    }

}


// --------------------------------------------------
// DRAW PLAYER
// --------------------------------------------------

function drawPlayer() {

    ctx.fillStyle = "#315f9b";

    ctx.fillRect(
        player.x-camera.x-9,
        player.y-camera.y-9,
        18,
        18
    );

    ctx.fillStyle = "#e5b38b";

    ctx.beginPath();

    ctx.arc(
        player.x-camera.x,
        player.y-camera.y-13,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();

}


// --------------------------------------------------
// MYSTERY CREATURE
// --------------------------------------------------

let creature = {

    x: 1650,
    y: 700,
    visible: false

};


function drawCreature() {

    if (!creature.visible) return;

    ctx.fillStyle = "#202020";

    ctx.fillRect(
        creature.x-camera.x-18,
        creature.y-camera.y-30,
        36,
        60
    );

    // antlers

    ctx.strokeStyle = "#c5b48a";

    ctx.lineWidth = 5;

    ctx.beginPath();

    ctx.moveTo(
        creature.x-camera.x-10,
        creature.y-camera.y-25
    );

    ctx.lineTo(
        creature.x-camera.x-25,
        creature.y-camera.y-55
    );

    ctx.moveTo(
        creature.x-camera.x+10,
        creature.y-camera.y-25
    );

    ctx.lineTo(
        creature.x-camera.x+25,
        creature.y-camera.y-55
    );

    ctx.stroke();

}


// --------------------------------------------------
// CAMERA
// --------------------------------------------------

function updateCamera() {

    camera.x =
        player.x - canvas.width/2;

    camera.y =
        player.y - canvas.height/2;

    camera.x =
        Math.max(
            0,
            Math.min(
                world.width-canvas.width,
                camera.x
            )
        );

    camera.y =
        Math.max(
            0,
            Math.min(
                world.height-canvas.height,
                camera.y
            )
        );

}


// --------------------------------------------------
// MAIN LOOP
// --------------------------------------------------

let gameStarted = false;

function update() {

    if (!currentCutscene) {

        updatePlayer();
        updateAnimals();
        checkTalk();

        updateCamera();

    }

    healthBar.style.width =
        player.health + "%";

    staminaBar.style.width =
        player.stamina + "%";


    if (messageTimer > 0) {

        messageTimer--;

        if (messageTimer <= 0) {
            message.style.display = "none";
        }

    }

}


function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawWorld();

    drawAnimals();
    drawNPCs();
    drawCreature();
    drawPlayer();

}


function gameLoop() {

    update();
    draw();

    requestAnimationFrame(gameLoop);

}


// --------------------------------------------------
// START
// --------------------------------------------------

startCutscene(openingCutscene);

gameLoop();

</script>

</body>
</html>
